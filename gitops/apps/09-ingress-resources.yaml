---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ GITOPS_REPO_URL }}"
    targetRevision: "{{ GITOPS_REPO_REVISION }}"
    path: gitops/manifests/ingress-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
