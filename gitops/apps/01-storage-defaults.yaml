---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-defaults
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "git@github.com:Speedylo/openstack_auto.git"
    targetRevision: "main"
    path: gitops/manifests/storage-defaults
    directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false   # do NOT delete k3s's own StorageClass if this Application is ever removed
      selfHeal: true
