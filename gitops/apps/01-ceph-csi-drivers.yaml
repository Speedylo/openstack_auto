---
# Confirmed via Rook's own upgrade docs: "This ceph-csi-drivers chart
# must be installed, otherwise the CSI driver will be in a failed
# state due to missing service accounts." ceph-csi-controller-manager
# (from rook-ceph, wave 1) is only the CONTROLLER that watches
# Driver/OperatorConfig CRs -- it doesn't deploy the actual
# csi-rbdplugin/csi-rbdplugin-provisioner pods until this chart
# creates the CR instances telling it to.
#
# NOT sourced from a Helm repo -- the documented one
# (https://ceph.github.io/ceph-csi-operator-charts) 404s right now on
# a direct fetch, confirmed, despite being what the project's own docs
# say to use (may just not be live yet / a documentation-vs-reality
# gap upstream). The same docs also show installing directly from the
# chart's location in git (`cd deploy/charts/ceph-csi-drivers && helm
# install ...`), so using that instead -- same git+path Helm source
# pattern already proven reliable for every openstack-helm chart in
# this project, rather than depending on a repo that isn't currently
# serving.
#
# operatorNamespace below is a best-effort guess at this chart's
# values schema based on Rook's docs ("setting proper driver names
# with the rook operator namespace as a prefix"), NOT independently
# verified against the chart's actual values.yaml -- if this
# Application errors on sync with an unrecognized-value warning
# (harmless) or, worse, deploys with wrong driver naming, check
# deploy/charts/ceph-csi-drivers/values.yaml in the ceph-csi-operator
# repo and correct this key.
#
# CAVEAT: targetRevision: main is a moving target, and we don't know
# exactly which ceph-csi-operator version Rook v1.19.3 bundles
# internally (different Rook releases pin different ones -- e.g. Rook
# v1.20.2's release notes mention bumping to ceph-csi-operator v1.0.4).
# If the Driver/OperatorConfig CRs this chart creates don't match what
# rook-ceph's bundled controller-manager expects, that's the first
# place to look. Pinning to a specific tag once one's confirmed
# compatible would be more correct than tracking main long-term.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi-drivers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ceph/ceph-csi-operator.git
    targetRevision: main
    path: deploy/charts/ceph-csi-drivers
    helm:
      releaseName: ceph-csi-drivers
      values: |
        operatorNamespace: rook-ceph
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
