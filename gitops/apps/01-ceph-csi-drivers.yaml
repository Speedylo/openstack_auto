---
# Confirmed via Rook's own upgrade docs: "This ceph-csi-drivers chart
# must be installed, otherwise the CSI driver will be in a failed
# state due to missing service accounts." ceph-csi-controller-manager
# (from rook-ceph, wave 1) is only the CONTROLLER that watches
# Driver/OperatorConfig CRs -- it doesn't deploy the actual
# csi-rbdplugin/csi-rbdplugin-provisioner pods until this chart
# creates the CR instances telling it to.
#
# IMPORTANT: this chart is NOT published from charts.rook.io/release
# (an earlier version of this file assumed it was, and guessed version
# v1.19.3 to match rook-ceph -- wrong on both counts, confirmed via
# ComparisonError: "chart ceph-csi-drivers version v1.19.3 not found").
# Per Rook's own docs: "Ceph-CSI publishes the drivers chart from the
# ceph-csi-operator Helm repository" -- a separate repo with its own
# independent versioning, not tied to Rook's release numbers at all.
# Using a broad range instead of guessing another exact pin.
#
# operatorNamespace below is a best-effort guess at this chart's
# values schema based on the docs' description ("setting proper driver
# names with the rook operator namespace as a prefix"), NOT
# independently verified against the chart's actual values.yaml -- if
# this Application errors on sync with an unrecognized-value warning
# (harmless) or, worse, deploys with wrong driver naming, check
# `helm show values ceph-csi-operator/ceph-csi-drivers` and correct
# this key.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi-drivers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://ceph.github.io/ceph-csi-operator-charts
    chart: ceph-csi-drivers
    targetRevision: ">=0.1.0"
    helm:
      releaseName: ceph-csi-drivers
      values: |
        operatorNamespace: rook-ceph
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
