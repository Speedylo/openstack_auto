---
# See gitops/manifests/glance-hook-jobs/job.yaml -- workaround for
# argoproj/argo-cd#23555. Wave 6, after glance's own Application
# (whatever wave that is) so its regular ConfigMaps/Secrets already
# exist for this Job's pods to mount.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance-hook-jobs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/manifests/glance-hook-jobs
    directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
