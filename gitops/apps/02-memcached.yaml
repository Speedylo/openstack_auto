---
# NOT every openstack-helm chart has a values_overrides/<chart>/2025.1-
# ubuntu_noble.yaml file -- these only exist where the chart actually
# needs a release/OS-specific override. This file does not exist for
# memcached at this release/OS combo (confirmed in the vendored tree
# too), so this Application uses chart defaults only -- no valueFiles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memcached
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/charts/openstack-helm/memcached
    helm:
      releaseName: memcached
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
