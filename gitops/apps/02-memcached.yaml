---
# NOT every openstack-helm chart has a values_overrides/<chart>/2025.1-
# ubuntu_noble.yaml file -- these only exist where the chart actually
# needs a release/OS-specific override; the original script's
# `helm osh get-values-overrides` plugin silently skips a missing
# file, but Argo CD's static valueFiles list can't -- it errors
# ("no such file or directory") if the file doesn't exist. Confirmed
# via ComparisonError that this file does not exist for memcached at
# this release/OS combo, so this Application uses chart defaults only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memcached
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://opendev.org/openstack/openstack-helm.git
    targetRevision: master
    path: memcached
    helm:
      releaseName: memcached
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
