---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neutron
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://opendev.org/openstack/openstack-helm.git
      targetRevision: master
      path: neutron
      helm:
        releaseName: neutron
        valueFiles:
          - $upstream/values_overrides/neutron/2025.1-ubuntu_noble.yaml
          - $local/gitops/values/neutron-local.yaml
    - repoURL: https://opendev.org/openstack/openstack-helm.git
      targetRevision: master
      ref: upstream
    - repoURL: "git@github.com:Speedylo/openstack_auto.git"
      targetRevision: "main"
      ref: local
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
