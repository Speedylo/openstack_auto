---
# Same situation as memcached (see 02-memcached.yaml comment):
# values_overrides/openvswitch/2025.1-ubuntu_noble.yaml doesn't exist
# in the repo for this chart. Chart defaults only, no valueFiles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openvswitch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/charts/openstack-helm/openvswitch
    helm:
      releaseName: openvswitch
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
