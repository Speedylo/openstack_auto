---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-adapter-rook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # conf.ceph.global.mon_host: an earlier version of this file left
  # this at the chart's default ("will be discovered"), on the
  # (wrong) assumption that a job would resolve it automatically at
  # runtime. Confirmed on a real cluster this is NOT the case: the
  # ceph-adapter-rook-namespace-client-ceph-config Job runs and
  # completes, but writes the literal string "will be discovered"
  # into the ceph-etc ConfigMap unchanged -- Cinder's storage-init Job
  # then fails trying to parse that string as a mon address
  # ("unable to parse addrs in 'will be discovered'").
  #
  # First fix attempt used a Service DNS name
  # (rook-ceph-mon-a.ceph.svc.cluster.local) -- also wrong, confirmed:
  # no such Service exists. Because 02-rook-ceph-cluster.yaml sets
  # network.provider: host, Rook's mon binds directly to the NODE's
  # own IP -- there's no ClusterIP Service to create at all, by
  # design. Correct value is the node's actual IP:port, confirmed
  # against Rook's own rook-ceph-mon-endpoints ConfigMap in the `ceph`
  # namespace (`kubectl get configmap -n ceph rook-ceph-mon-endpoints
  # -o jsonpath='{.data.data}'`), which will always have the current
  # authoritative value if this ever needs re-checking.
  #
  # This is inherently tied to this specific node's IP -- stable
  # across reboots of the same VM (confirmed), but would need updating
  # by hand if this ever moves to a different VM/IP (e.g. another
  # full rebuild, as happened once already in this project).
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/charts/openstack-helm/ceph-adapter-rook
    helm:
      releaseName: ceph-adapter-rook
      parameters:
        - name: conf.ceph.global.mon_count
          value: "1"
        - name: conf.ceph.global.mon_host
          value: "192.168.10.145:6789"
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
