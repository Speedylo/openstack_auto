---
# Ported from ceph-rook.sh's /tmp/rook.yaml (values passed to
# `helm install rook-ceph rook-release/rook-ceph`), with the version
# pin (v1.19.3) kept exact rather than loosened to a range, since this
# script clearly cares about a specific Rook/CSI combination.
#
# allowLoopDevices: true is the one setting here that everything else
# in this deployment depends on -- CEPH_OSD_DATA_DEVICE is /dev/loop100
# (a loop device backed by the file openstack-host-deps.service creates
# on the host). Without this flag Rook's OSD discovery silently ignores
# loop devices and rook-ceph-cluster (wave 2) would sit with zero OSDs
# and no clear error pointing at why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.19.3
    helm:
      releaseName: rook-ceph
      values: |
        image:
          repository: rook/ceph
          tag: v1.19.3
          pullPolicy: IfNotPresent
        crds:
          enabled: true
        currentNamespaceOnly: false
        logLevel: INFO
        rbacEnable: true
        pspEnable: false
        allowLoopDevices: true
        csi:
          enableRbdDriver: true
          enableCephfsDriver: false
          enableGrpcMetrics: false
          enableCSIHostNetwork: true
          enableCephfsSnapshotter: true
          enableNFSSnapshotter: true
          enableRBDSnapshotter: true
          enablePluginSelinuxHostMount: false
          enableCSIEncryption: false
          pluginPriorityClassName: system-node-critical
          provisionerPriorityClassName: system-cluster-critical
          rbdFSGroupPolicy: "File"
          cephFSFSGroupPolicy: "File"
          nfsFSGroupPolicy: "File"
          enableOMAPGenerator: false
          provisionerReplicas: 1
          clusterName: ceph
          logLevel: 0
          grpcTimeoutInSeconds: 150
          allowUnsupportedVersion: false
          enableLiveness: false
          forceCephFSKernelClient: true
          csiAddons:
            enabled: false
          nfs:
            enabled: false
          topology:
            enabled: false
          readAffinity:
            enabled: false
          cephFSAttachRequired: true
          rbdAttachRequired: true
          nfsAttachRequired: true
        enableDiscoveryDaemon: false
        cephCommandsTimeoutSeconds: "15"
        disableAdmissionController: true
        hostpathRequiresPrivileged: false
        disableDeviceHotplug: false
        enableOBCWatchOperatorNamespace: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Rook's CSI CRDs (drivers.csi.ceph.io, operatorconfigs.csi.ceph.io)
      # have large embedded schemas. Argo CD's default client-side apply
      # stores the full manifest in a kubectl.kubernetes.io/last-applied-
      # configuration annotation for diffing, and that blows past the API
      # server's 262144-byte annotation size limit for CRDs this big.
      # Server-side apply doesn't use that annotation at all.
      - ServerSideApply=true
