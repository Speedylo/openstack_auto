---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # OCI Helm source. This part of the syntax turned out fine -- an
  # earlier session, on a different (now-decommissioned) VM, hit a 401
  # error here that looked identical to a known Argo CD OCI bug
  # (argo-cd#22100) -- but on THIS cluster this Application has been
  # confirmed Synced/Healthy the whole time. Leaving native OCI source
  # in place rather than replacing it with an unneeded workaround.
  source:
    repoURL: oci://registry-1.docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.7.4
    helm:
      releaseName: eg
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
