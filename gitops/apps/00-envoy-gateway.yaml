---
# See gitops/manifests/envoy-gateway-install/job.yaml for why this is
# a Job wrapping plain `helm upgrade --install` rather than Argo CD's
# native OCI Helm source (which hits a confirmed, intermittent open
# upstream bug for this specific chart -- argo-cd#22100).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/manifests/envoy-gateway-install
    directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
