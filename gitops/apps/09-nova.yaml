---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Speedylo/openstack_auto.git
    targetRevision: main
    path: gitops/charts/openstack-helm/nova
    helm:
      releaseName: nova
      valueFiles:
        - ../values_overrides/nova/2025.1-ubuntu_noble.yaml
        - ../../../values/nova-local.yaml
      parameters:
        - name: bootstrap.wait_for_computes.enabled
          value: "true"
        - name: conf.ceph.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
