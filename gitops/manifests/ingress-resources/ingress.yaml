  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.openstack.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
