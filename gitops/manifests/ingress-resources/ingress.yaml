---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horizon-ingress
  namespace: openstack
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: horizon.openstack.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: horizon-int
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova-novncproxy-ingress
  namespace: openstack
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: novnc.openstack.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova-novncproxy
                port:
                  number: 6080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
