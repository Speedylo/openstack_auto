---
# Ported from Phase 4/5's exact labeling logic -- NOT "label every node
# with everything" (an earlier draft of this file did that, which is a
# real behavioral difference from the script and would matter on a
# multi-node cluster): ceph-mon/ceph-osd/ceph-mds/ceph-rgw go on the
# FIRST node only (`kubectl get nodes -o jsonpath='{.items[0]...}'` in
# the original); openstack-control-plane/openstack-compute-node/
# openvswitch go on ALL nodes (`kubectl label --overwrite nodes --all
# ...`). On this project's single-node cluster the two are equivalent
# today, but this keeps the manifest an honest port rather than a
# reinterpretation.
apiVersion: batch/v1
kind: Job
metadata:
  name: node-labels
  namespace: kube-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: node-labeler
      restartPolicy: OnFailure
      containers:
        - name: label-nodes
          # bitnami/kubectl:1.31 no longer exists -- Bitnami discontinued
          # the entire docker.io/bitnami free catalog (staged shutdown
          # Aug-Sep 2025). Their own suggested fallback, bitnamilegacy/*,
          # is explicitly documented as temporary/removable, so not
          # using that either. Update: rancher/kubectl was ALSO wrong --
          # confirmed on a real cluster it ships with no shell at all
          # ("/bin/sh": no such file or directory), so a command-based
          # container using it can never actually start. alpine/k8s
          # bundles kubectl + a real shell, verified directly (`which
          # kubectl && which sh` both resolved) before using it here.
          image: alpine/k8s:1.31.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              FIRST_NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              kubectl label node "$FIRST_NODE" \
                ceph-mon=enabled \
                ceph-osd=enabled \
                ceph-mds=enabled \
                ceph-rgw=enabled \
                --overwrite
              kubectl label --overwrite nodes --all \
                openstack-control-plane=enabled \
                openstack-compute-node=enabled \
                openvswitch=enabled
