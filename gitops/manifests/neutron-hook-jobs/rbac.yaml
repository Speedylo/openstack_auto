---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neutron-hook-job-precreate
  namespace: openstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neutron-hook-job-precreate
  namespace: openstack
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neutron-hook-job-precreate
  namespace: openstack
subjects:
  - kind: ServiceAccount
    name: neutron-hook-job-precreate
    namespace: openstack
roleRef:
  kind: Role
  name: neutron-hook-job-precreate
  apiGroup: rbac.authorization.k8s.io
