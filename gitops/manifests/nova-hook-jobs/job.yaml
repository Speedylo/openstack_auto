---
# Workaround for argoproj/argo-cd#23555. Filters on BOTH the
# helm.sh/hook annotation AND plain kind: Job -- confirmed on a real
# cluster that not every missing Job in these charts is hook-annotated
# (e.g. cinder-storage-init is a plain Job that still didn't get
# created by Argo CD's regular sync), so hook-annotation-only filtering
# missed it. This is the broadened version of the filter, applied
# retroactively to all charts using this pattern.
apiVersion: batch/v1
kind: Job
metadata:
  name: nova-hook-job-precreate
  namespace: openstack
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: nova-hook-job-precreate
      restartPolicy: OnFailure
      volumes:
        - name: shared
          emptyDir: {}
      initContainers:
        - name: render
          image: alpine/helm:3.16.4
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache git >/dev/null
              git clone --depth 1 --branch master \
                https://opendev.org/openstack/openstack-helm.git /tmp/openstack-helm
              cd /tmp/openstack-helm/nova
              helm dependency build >/dev/null 2>&1 || true
              helm template nova . --namespace openstack > /shared/rendered.yaml
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: extract-and-create
          image: alpine/k8s:1.31.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              awk '/^---/{n++} {print > ("/tmp/doc-" n ".yaml")}' /shared/rendered.yaml
              for f in /tmp/doc-*.yaml; do
                if grep -q "helm.sh/hook" "$f" 2>/dev/null || grep -q "^kind: Job" "$f" 2>/dev/null; then
                  echo "Creating: $(grep 'name:' "$f" | head -1)"
                  kubectl create -f "$f" || true
                fi
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
