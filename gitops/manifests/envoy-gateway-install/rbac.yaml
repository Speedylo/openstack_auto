---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-gateway-installer
  namespace: kube-system
---
# cluster-admin is a deliberate, pragmatic simplification for this ONE
# bootstrap Job on a single-tenant lab cluster -- the envoy-gateway
# chart creates a broad mix of resource types (Deployments, RBAC,
# Services, CRDs, webhooks) and enumerating a tightly-scoped ClusterRole
# for all of them isn't worth the fragility here. Do NOT copy this
# pattern into a multi-tenant or production-hardened environment
# without narrowing it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envoy-gateway-installer
subjects:
  - kind: ServiceAccount
    name: envoy-gateway-installer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
