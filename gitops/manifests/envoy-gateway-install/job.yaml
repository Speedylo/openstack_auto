---
# Argo CD's native OCI Helm source hits a confirmed, open upstream bug
# with this exact chart (argoproj/argo-cd#22100 -- "Installing envoy
# gateway via helm chart using ArgoCD: Error 401 when pulling image"),
# unrelated to which tag is requested (confirmed on a real cluster:
# both v1.7.0 and v1.7.4 fail identically). Sidestepping it by running
# plain `helm upgrade --install` in a Job instead -- helm itself pulls
# this chart fine; it's specifically Argo CD's OCI resolution codepath
# that's broken for it. This also mirrors the original working
# script's exact command more literally than the native-source
# approach did.
apiVersion: batch/v1
kind: Job
metadata:
  name: envoy-gateway-install
  namespace: kube-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: envoy-gateway-installer
      restartPolicy: OnFailure
      containers:
        - name: helm-install
          image: alpine/helm:3.16.4
          command:
            - /bin/sh
            - -c
            - |
              set -e
              helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm \
                --version v1.7.4 \
                --namespace envoy-gateway-system --create-namespace
