---
# Workaround for argoproj/argo-cd#23555 (confirmed, currently open):
# Argo CD does not create Helm-hook-annotated resources defined by
# openstack-helm charts -- and this is NOT limited to Jobs. Confirmed
# on a real cluster that keystone-credential-keys/keystone-fernet-keys
# are plain Secrets with "helm.sh/hook: pre-install", not Jobs, and an
# earlier version of this workaround only extracted kind: Job, silently
# missing them. Filtering by the helm.sh/hook annotation itself (any
# resource kind) instead of by kind: Job is the correct, complete fix
# for this class of problem.
#
# --set storage=pvc: a SEPARATE bug from the above, specific to this
# chart. This render was using bare chart defaults with no -f values
# files at all, unlike the real `glance` Application (05-glance.yaml),
# which correctly applies storage: pvc via values/glance-local.yaml.
# The chart's own default is storage: swift -- confirmed on a real
# cluster this caused glance-storage-init to render with
# STORAGE_BACKEND=swift and attempt Swift Temp URL setup (failing,
# since no Swift service exists in this deployment; initially
# misdiagnosed as an upstream openstack-helm bug before tracing it
# back to this render never seeing our override at all). The chart's
# own template logic (job-storage-init.yaml) is correctly gated on
# `eq .Values.storage "swift"` -- passing the right value here is the
# actual, complete fix.
apiVersion: batch/v1
kind: Job
metadata:
  name: glance-hook-job-precreate
  namespace: openstack
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: glance-hook-job-precreate
      restartPolicy: OnFailure
      volumes:
        - name: shared
          emptyDir: {}
      initContainers:
        - name: render
          image: alpine/helm:3.16.4
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache git >/dev/null
              git clone --depth 1 --branch main \
                https://github.com/Speedylo/openstack_auto.git /tmp/repo
              cd /tmp/repo/gitops/charts/openstack-helm/glance
              helm template glance . --namespace openstack \
                --values ../values_overrides/glance/2025.1-ubuntu_noble.yaml \
                --values ../../../values/glance-local.yaml \
                --set storage=pvc \
                > /shared/rendered.yaml
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: extract-and-create
          image: alpine/k8s:1.31.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              awk '/^---/{n++} {print > ("/tmp/doc-" n ".yaml")}' /shared/rendered.yaml
              for f in /tmp/doc-*.yaml; do
                if grep -q "helm.sh/hook" "$f" 2>/dev/null || grep -q "^kind: Job" "$f" 2>/dev/null; then
                  echo "Creating: $(grep 'name:' "$f" | head -1)"
                  kubectl create -f "$f" || true
                fi
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
