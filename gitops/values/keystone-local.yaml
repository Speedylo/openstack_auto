# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
# Keystone has no self-registration mechanism for its own catalog entry
# (no ks-endpoints Job) -- this is set for correctness/consistency, but
# what actually matters for CLI access is the client-side OS_AUTH_URL.
endpoints:
  identity:
    host_fqdn_override:
      public:
        host: keystone.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  keystone_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: keystone-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.identity.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: keystone-api
              port: 5000
