# Ceph pool replication: single-OSD lab cluster, so cinder.volumes
# must be size 1 (chart default is 3, which can never be satisfied
# here and causes a permanent HEALTH_WARN: 32 pgs degraded/undersized).
# storage-init's ensure_pool unconditionally re-applies this value on
# EVERY run, not just on first pool creation (see
# cinder/templates/bin/_storage-init.sh.tpl) -- a live `ceph osd pool
# set` fix alone gets silently reverted the next cinder-storage-init
# re-render, which is why this needs to be a values override instead.
conf:
  ceph:
    pools:
      cinder.volumes:
        replication: 1

# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
endpoints:
  volumev3:
    host_fqdn_override:
      public:
        host: cinder.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  cinder_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: cinder-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.volumev3.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: cinder-api
              port: 8776
