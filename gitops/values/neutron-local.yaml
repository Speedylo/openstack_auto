# Ported from Phase 6's neutron_simple.yaml. auto_bridge_add maps br-ex
# to the dummy0 provider interface created by openstack-host-deps.service
# (Ansible: openstack-persistence role) — that mapping is a host-level
# concern already handled outside GitOps, this is just the Neutron-side
# config that references it.
conf:
  neutron:
    DEFAULT:
      l3_ha: False
      max_l3_agents_per_router: 1
  auto_bridge_add:
    br-ex: dummy0
  plugins:
    ml2_conf:
      ml2_type_flat:
        flat_networks: public
    openvswitch_agent:
      ovs:
        bridge_mappings: public:br-ex

# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
endpoints:
  network:
    host_fqdn_override:
      public:
        host: neutron.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  neutron_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: neutron-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.network.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: neutron-server
              port: 9696
