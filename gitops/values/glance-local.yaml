# Ported from Phase 6's glance_pvc_storage.yaml.
storage: pvc
volume:
  class_name: general
  size: 10Gi

# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
endpoints:
  image:
    host_fqdn_override:
      public:
        host: glance.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  glance_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: glance-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.image.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          # Large image uploads (e.g. the amphora qcow2) can take minutes.
          timeouts:
            request: 600s
            backendRequest: 600s
          backendRefs:
            - name: glance-api
              port: 9292
