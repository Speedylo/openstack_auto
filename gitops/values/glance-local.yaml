# Ported from Phase 6's glance_pvc_storage.yaml.
storage: pvc
volume:
  class_name: general
  size: 10Gi

# Single-worker uwsgi can't answer /healthcheck while synchronously writing
# a large image upload to disk. Default failureThreshold (3, ~30s) kills
# glance-api mid-upload; raise it to survive multi-hundred-MB uploads.
pod:
  probes:
    api:
      glance-api:
        readiness:
          params:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
        liveness:
          params:
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
endpoints:
  image:
    host_fqdn_override:
      public:
        host: glance.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  glance_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: glance-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.image.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          # Large image uploads (e.g. the amphora qcow2) can take minutes.
          timeouts:
            request: 600s
            backendRequest: 600s
          backendRefs:
            - name: glance-api
              port: 9292
