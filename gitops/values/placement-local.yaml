# Envoy Gateway API exposure: public endpoint reachable via the pinned
# nodePort 30080 (see gitops/manifests/envoy-gateway-config/gateway.yaml).
endpoints:
  placement:
    host_fqdn_override:
      public:
        host: placement.openstack.internal
    port:
      api:
        public: 30080

extraObjects:
  placement_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: placement-route
      namespace: "{{ .Release.Namespace }}"
    spec:
      hostnames:
        - "{{ .Values.endpoints.placement.host_fqdn_override.public.host }}"
      parentRefs:
        - name: gateway-default
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: placement-api
              port: 8778
