---
all:
  children:
    openstack_hosts:
      hosts:
        infomaniak-node:
          ansible_host: "{{ lookup('env', 'OPENSTACK_HOST_IP') }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "{{ lookup('env', 'OPENSTACK_SSH_KEY') }}"
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
          # NOTE: SSH here refers to the Ansible control connection only.
          # This still assumes a path in that reaches the host (e.g. run
          # Ansible from a machine already on the Tailscale network, or
          # over the host's Tailscale IP) — corporate SSH-block constraints
          # documented separately in Tailscale_Access_Architecture.md apply
          # to *instance* access, not to this control-plane host itself.
