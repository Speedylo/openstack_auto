---
# Phase 3 equivalent: Helm repo registration and openstack-helm
# workspace clone. This is the last host-layer step before
# hand-off to GitOps (Argo CD) for actual chart deployment.

- name: Add required Helm repositories
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: openstack-helm, url: "https://tarballs.opendev.org/openstack/openstack-helm" }
    - { name: metallb, url: "https://metallb.github.io/metallb" }
    - { name: ingress-nginx, url: "https://kubernetes.github.io/ingress-nginx" }

- name: Install the openstack-helm-plugin Helm plugin
  become_user: "{{ kube_user }}"
  command: helm plugin install https://opendev.org/openstack/openstack-helm-plugin
  register: plugin_install
  failed_when: false
  changed_when: "'already exists' not in plugin_install.stderr"

- name: Ensure workspace directory exists
  file:
    path: "{{ workspace_dir }}"
    state: directory
    owner: "{{ kube_user }}"
    group: "{{ kube_user }}"
    mode: "0755"

- name: Clone the openstack-helm repository
  become_user: "{{ kube_user }}"
  git:
    repo: https://opendev.org/openstack/openstack-helm.git
    dest: "{{ workspace_dir }}/openstack-helm"
    update: false
    # update: false means "clone if missing, leave alone if present" —
    # avoids clobbering local overrides/ edits on subsequent runs.
