---
# Bootstraps the GitOps layer: installs Argo CD, then hands off control
# of everything else (Phases 4-9 equivalents) to the root-app
# Application, which syncs gitops/apps/ from this same git repo.
# From this point on, cluster state is converged by Argo CD, not by
# further Ansible runs or imperative helm/kubectl commands.

- name: Fail fast if gitops_repo_url is not set
  assert:
    that:
      - gitops_repo_url is defined
      - gitops_repo_url | length > 0
    fail_msg: >-
      gitops_repo_url is empty. Export GITOPS_REPO_URL to the git URL
      this repo is pushed to (Argo CD needs to be able to reach it from
      inside the cluster — a public HTTPS URL, or a private one with
      credentials registered in Argo CD separately).

- name: Install Python libraries required by kubernetes.core modules
  # kubernetes.core.k8s needs the `kubernetes` python client library
  # plus `jsonpatch` (used internally even for state: present, not just
  # explicit patch operations) -- neither ships on a base Ubuntu image.
  # kubernetes.core.helm_repository (used earlier in helm-workspace)
  # didn't hit this because it's a thin wrapper around the `helm`
  # binary itself and never talks to the API directly. Note:
  # kubernetes.core.helm's own docs list only the `helm` CLI as a
  # requirement, not this library -- installing it here anyway since
  # it's shared across the collection and cheap to have regardless.
  apt:
    name:
      - python3-kubernetes
      - python3-jsonpatch
    state: present
    update_cache: true

- name: Create argocd namespace
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Add the argo-helm repository
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install/upgrade Argo CD
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    wait: true
    values:
      # Single-node lab cluster: HA replica counts in the default chart
      # values would just sit Pending with no second/third node to
      # schedule onto.
      redis-ha:
        enabled: false
      controller:
        replicas: 1
      server:
        replicas: 1
        # No public DNS/cert set up yet for Argo CD's own UI at this
        # stage — plaintext until that's addressed. Do not carry this
        # into anything beyond a lab environment.
        insecure: true
      repoServer:
        replicas: 1
      applicationSet:
        replicas: 1

- name: Wait for the Argo CD application controller StatefulSet to be ready
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    kubectl rollout status statefulset/{{ argocd_release_name }}-application-controller
    -n {{ argocd_namespace }} --timeout=180s
  changed_when: false

# gitops_repo_url is an SSH URL. Unlike HTTPS, SSH has no anonymous-read
# mode for a public repo -- the transport authenticates the client
# before the git server even looks at repo visibility. Argo CD's
# repo-server also doesn't use the host's ssh-agent (that's exactly
# the "SSH_AUTH_SOCK not-specified" error from the first attempt at
# this) -- it needs its own key registered as a credential Secret it
# controls. `creates:` makes key generation idempotent across reruns:
# once a key exists at gitops_ssh_key_path, it's reused rather than
# regenerated, so a previously-registered deploy key on the git host
# doesn't get silently invalidated by a later Ansible run.
# ssh-keygen doesn't create parent directories -- ~/.ssh almost
# certainly already exists (it's how Ansible is reaching this host at
# all), but not guaranteed for every possible ansible_user/auth setup.
- name: Ensure ~/.ssh exists
  become_user: "{{ kube_user }}"
  file:
    path: "/home/{{ kube_user }}/.ssh"
    state: directory
    mode: "0700"

- name: Generate an Argo CD deploy key, if one doesn't already exist
  become_user: "{{ kube_user }}"
  command: >
    ssh-keygen -t ed25519 -f {{ gitops_ssh_key_path }} -N ""
    -C "argocd-deploy-key ({{ gitops_repo_url }})"
  args:
    creates: "{{ gitops_ssh_key_path }}"

- name: Read the generated private key
  become_user: "{{ kube_user }}"
  slurp:
    src: "{{ gitops_ssh_key_path }}"
  register: gitops_ssh_privkey_slurp
  no_log: true

- name: Read the generated public key
  become_user: "{{ kube_user }}"
  slurp:
    src: "{{ gitops_ssh_key_path }}.pub"
  register: gitops_ssh_pubkey_slurp

# Scoped to this exact repo URL (secret-type: repository), not a
# URL-prefix credential template (secret-type: repo-creds) that would
# apply to every repo under the same host -- this key should only ever
# be trusted for this one repo.
- name: Register the deploy key as an Argo CD repository credential
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitops-repo-creds
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ gitops_repo_url }}"
        sshPrivateKey: "{{ gitops_ssh_privkey_slurp.content | b64decode }}"
  no_log: true

# Argo CD ships a default known_hosts ConfigMap already covering
# github.com/gitlab.com/bitbucket.org/ssh.dev.azure.com. If
# gitops_repo_url is on a self-hosted git server, this Application will
# fail with a host-key verification error instead of an auth error --
# if that happens, extend argocd-ssh-known-hosts-cm in the argocd
# namespace with that host's key (`ssh-keyscan <host>`).
- name: Show the public key that needs to be added as a deploy key
  debug:
    msg: >-
      Add this as a READ-ONLY deploy key on {{ gitops_repo_url }}, if it
      isn't already registered there:
      {{ gitops_ssh_pubkey_slurp.content | b64decode | trim }}

- name: Render the root-app (App-of-Apps) manifest
  become_user: "{{ kube_user }}"
  template:
    src: root-app.yaml.j2
    dest: "/home/{{ kube_user }}/root-app.yaml"
    mode: "0644"

- name: Apply the root-app — from here on, Argo CD owns Phases 4-9
  become_user: "{{ kube_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  kubernetes.core.k8s:
    state: present
    src: "/home/{{ kube_user }}/root-app.yaml"
