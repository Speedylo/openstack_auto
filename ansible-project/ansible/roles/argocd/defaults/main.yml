---
argocd_namespace: argocd
argocd_chart_version: ">=7.0.0"
argocd_release_name: argocd

# Git repo Argo CD's App-of-Apps (root-app) reads from. This is the SAME
# repo this Ansible project lives in — root-app.yaml points at the
# gitops/apps/ directory within it. No default on purpose: Argo CD can't
# usefully bootstrap against a placeholder URL, so this must be set
# explicitly (mirrors how OPENSTACK_SSH_KEY has no default in inventory).
gitops_repo_url: "{{ lookup('env', 'GITOPS_REPO_URL') }}"
gitops_repo_revision: "{{ lookup('env', 'GITOPS_REPO_REVISION') | default('main', true) }}"

# Where the Argo CD deploy key is generated/persisted on the target
# host. Stable across reruns on purpose -- see the `creates:` note in
# tasks/main.yml.
gitops_ssh_key_path: "/home/{{ ansible_user }}/.ssh/argocd-deploy-key"
